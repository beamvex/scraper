[package]
name = "scraper"
version = "0.1.0"
edition = "2024"

[dependencies]
 anyhow = "1"
 chromiumoxide = "0.9.1"
 dotenvy = "0.15"
 futures = "0.3"
 rand = "0.9"
 reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart"] }
 serde_json = "1"
 tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
 tracing = "0.1"
 tracing-subscriber = { version = "0.3", features = ["env-filter"] }
