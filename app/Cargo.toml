[package]
name = "scraper"
version = "0.1.0"
edition = "2024"
default-run = "scraper"

[dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
chromiumoxide = "0.9.1"
dotenvy = "0.15"
futures = "0.3"
html2text = "0.13"
once_cell = "1"
rand = "0.9"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "blocking"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
