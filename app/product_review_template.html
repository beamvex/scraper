<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  gtag('config', 'G-QQMJVW98SP');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} | My Favourite Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/index.html">My Favourite Products</a>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row g-5 align-items-center">
      <div class="col-lg-6">
        <img src="{{IMAGE_URL}}" class="img-fluid rounded shadow" alt="{{TITLE}}">
      </div>
      <div class="col-lg-6">
        <h1 class="display-5 fw-bold">{{TITLE}}</h1>
        <h2 class="text-primary">{{PRICE}}</h2>
        <p class="lead">{{SHORT_DESCRIPTION}}</p>
        <div class="d-grid gap-2 d-md-flex justify-content-md-start my-4">
          <a class="btn btn-primary btn-lg" href="{{BUY_URL}}">Buy on Amazon</a>
          <a class="btn btn-outline-secondary btn-lg" href="/index.html">Back to Index</a>
        </div>
      </div>
    </div>

    <hr class="my-5">

    <div class="row">
      <div class="col-12">
        {{CONTENT}}
      </div>
    </div>

    <hr class="my-5">

    <div class="row">
      <div class="col-12">
        <h3>Gallery</h3>
        {{GALLERY}}
      </div>
    </div>
  </div>

  <footer class="bg-light text-center py-4 mt-5">
    <div class="container">
      <p class="mb-0 text-muted">&copy; {{YEAR}} My Favourite Products</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
